name: Smoke Test (Packages)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "otplib version to test (e.g., 13.0.0, latest)"
        required: false
        default: "latest"

permissions: {}

env:
  NODE_VERSION_TARGET: "24"
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # Note:
  # This workflow uses `npm` instead of `pnpm` for package management
  # My assumption is that more users are on npm.
  smoke-test-packages:
    environment: general
    name: Smoke Test (Packages)
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for checkout
      checks: write # Required for uploading test results
    steps:
      - name: Set version
        run: echo "OTPLIB_VERSION=${{ github.event.inputs.version || 'latest' }}" >> $GITHUB_ENV

      - name: Checkout smoke tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: smoke-tests
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION_TARGET }}
          cache: "npm"
          cache-dependency-path: package.json

      - name: Wait for npm to propagate
        run: |
          set -euo pipefail
          packages=(
            otplib
            @otplib/core
            @otplib/totp
            @otplib/hotp
            @otplib/uri
            @otplib/plugin-base32-scure
            @otplib/plugin-crypto-noble
            @otplib/plugin-crypto-node
          )
          deadline=$((SECONDS + 900))
          for pkg in "${packages[@]}"; do
            until npm view "${pkg}@${OTPLIB_VERSION}" version > /dev/null 2>&1; do
              if (( SECONDS >= deadline )); then
                echo "::error::Timed out waiting for ${pkg}@${OTPLIB_VERSION} to appear on npm"
                exit 1
              fi
              echo "Waiting for ${pkg}@${OTPLIB_VERSION}..."
              sleep 30
            done
            echo "Found ${pkg}@${OTPLIB_VERSION}"
          done

      - name: Install dependencies
        run: npm install

      - name: Install otplib packages
        run: npm run install:packages

      - name: Run smoke tests
        run: npm run test:all

      - name: Run TypeScript type check
        run: npm run test:typecheck
