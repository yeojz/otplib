packages:
  - "apps/*"
  - "internal/*"
  - "packages/*"

# Delay installing newly published versions to reduce risk of compromised packages
minimumReleaseAge: 10080

# Dependency install scripts. pnpm 11 replaces "onlyBuiltDependencies" with
# "allowBuilds" and now fails the install when a package wants to run a build
# script that has not been decided on. These stay denied, matching the previous
# behaviour: esbuild resolves its binary from the platform-specific optional
# package, and lefthook is installed by the root "postinstall" script.
allowBuilds:
  esbuild: false
  lefthook: false

# Security overrides. Moved here from package.json "pnpm.overrides": pnpm 11
# no longer reads the "pnpm" field in package.json.
overrides:
  'ajv@>=6.0.0 <6.14.0': 6.14.0
  'esbuild@<=0.24.2': '>=0.25.0 <0.28.0'
  'fast-uri@>=3.0.0 <3.1.6': '>=3.1.6 <4.0.0'
  'js-yaml@>=4.0.0 <4.3.1': '>=4.3.1 <5.0.0'
  'linkify-it@>=5.0.0 <5.0.2': '>=5.0.2 <6.0.0'
  'markdown-it@>=13.0.0 <14.2.0': '>=14.2.0 <15.0.0'
  minimatch: '>=10.2.3'
  'preact@>=10.28.0 <10.28.2': '>=10.28.2'
  'qs@>=6.11.1 <6.16.0': '>=6.16.0 <7.0.0'
  'rollup@>=4.0.0 <4.59.0': '>=4.59.0'
  'flatted@<=3.4.1': '>=3.4.2'
  undici: '>=8.9.0'
  'picomatch@>=4.0.0 <4.0.4': '>=4.0.4'
  'yaml@>=2.0.0 <2.8.3': '>=2.8.3'
  'brace-expansion@>=4.0.0 <5.0.7': '>=5.0.7'
  'postcss@<8.5.10': '>=8.5.10'
